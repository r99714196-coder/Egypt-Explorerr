<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Culture | Egypt Explorer</title>

<link rel="stylesheet" href="style-main.css">
</head>

<body class="culture">

<button class="back-btn" onclick="goMain()">⬅ Back</button>

<nav class="navbar">
  <div class="logo">Egypt Explorer</div>

<div class="container">

    <div class="card" onclick="openPage('craft')">
    <img src="images/craft1.jpg" alt="Egyptian Crafts">

</div>


<div class="card" onclick="openPage('market')">
    <img src="images/market1.jpg" alt="Egyptian Markets">
    <h2>Egyptian Markets</h2>
</div>

    
    <div class="card" onclick="openPage('calligraphy')">
    <img src="images/call1.jpg" alt="Egyptian Calligraphy">
    <h2>Egyptian Calligraphy</h2>
</div>

    <div class="card" onclick="openPage('music')">
    <img src="images/music1.jpg" alt="Egyptian Music">
    <h2>Egyptian Music</h2>
</div>

    <div class="card" onclick="openPage('dress')">
    <img src="images/dress1.jpg" alt="Traditional Egyptian Dress">
